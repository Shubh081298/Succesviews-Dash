name: Deploy SuccessViews Dashboard

# ─────────────────────────────────────────────────────────────────
# Production deploy workflow: build the Vite app, then ship the
# static `dist/` output to a Linux server over SSH + rsync.
#
# Triggers on every push to `main`, and can also be run manually
# from the Actions tab (workflow_dispatch).
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
#   SSH_HOST        e.g. 203.0.113.10 or deploy.yourdomain.com
#   SSH_USERNAME    e.g. deploy
#   SSH_PRIVATE_KEY the private key matching a public key already
#                   authorized on the server (~/.ssh/authorized_keys)
#   SSH_TARGET_DIR  absolute path to deploy into, e.g. /var/www/successviews
#   SSH_PORT        optional, defaults to 22 if not set
#
# No credentials are stored in this file — everything sensitive is
# read from GitHub Secrets at run time.
#
# ADAPTING TO OTHER TARGETS:
#   • Vercel/Netlify: replace the "Deploy via rsync" step with the
#     platform's official deploy action (e.g. amondnet/vercel-action
#     or netlify/actions/cli) and swap the secrets accordingly.
#   • AWS S3 + CloudFront: replace the deploy step with
#     `aws s3 sync dist/ s3://your-bucket` plus a CloudFront
#     invalidation step, using AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#     secrets and configure-aws-credentials action.
#   • Docker/Container registry: add a build-and-push-image step
#     instead of rsync, then trigger your orchestrator (k8s/ECS) to
#     pull the new image.
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: successviews-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: successviews-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: successviews-app/dist/
          remote_path: ${{ secrets.SSH_TARGET_DIR }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT || 22 }}

      - name: Deployment summary
        run: |
          echo "✅ Deployed successviews-app/dist to ${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}"
